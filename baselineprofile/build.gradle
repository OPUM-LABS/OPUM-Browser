plugins {
    id 'com.android.test'
    id 'androidx.baselineprofile'
}

// Generates the app's baseline profile and measures start-up and scrolling (2026-11-21). Runs against the app's qa
// build (its own package, ch.opumlabs.opumbrowser.qa), so the user's installed app and its data are never touched.
android {
    namespace = 'ch.opumlabs.opumbrowser.baselineprofile'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        minSdk = 32
        targetSdk = 37
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        // benchmarks on the emulator are for the profile and for before / after comparisons, not absolute numbers
        testInstrumentationRunnerArguments['androidx.benchmark.suppressErrors'] = 'EMULATOR'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    targetProjectPath = ':app'

    // matches the app's qa build type: the plugin makes nonMinifiedQa / benchmarkQa from it (package .qa)
    buildTypes {
        qa {}
    }
}

baselineProfile {
    useConnectedDevices = true
}

dependencies {
    implementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.test:runner:1.7.0'
    implementation 'androidx.test.uiautomator:uiautomator:2.4.1'
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.5.0'
}

// Only the qa variants exist here: the release ones would install and drive the app under the user's own package
// (ch.opumlabs.opumbrowser) on the connected device. With them gone, :app:generateBaselineProfile can only use .qa.
androidComponents {
    beforeVariants(selector().all()) { variant ->
        if (!variant.buildType.toLowerCase().contains('qa')) variant.enable = false
    }
}
